<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="80%" stop-color="#31104b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Emerald / Teal Glow -->
    <radialGradient id="emeraldGlow" cx="25%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Indigo / Purple Glow -->
    <radialGradient id="purpleGlow" cx="80%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.035" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="600" fill="url(#coverBg)" />
  <rect width="1200" height="600" fill="url(#emeraldGlow)" />
  <rect width="1200" height="600" fill="url(#purpleGlow)" />
  <rect width="1200" height="600" fill="url(#gridPattern)" />

  <!-- Geometric Decorative Lines & Circles -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="600" cy="300" r="260" stroke-dasharray="8 8" />
    <circle cx="600" cy="300" r="190" />
    <circle cx="600" cy="300" r="120" stroke-dasharray="4 4" />
    <line x1="100" y1="300" x2="1100" y2="300" stroke-opacity="0.08" />
  </g>

  <!-- Central Stylized Storefront & Books Icon Graphic -->
  <g transform="translate(600, 240)">
    <!-- Ambient Badge Halo -->
    <circle cx="0" cy="0" r="76" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))" />
    <circle cx="0" cy="0" r="64" fill="#0f172a" fill-opacity="0.9" stroke="url(#goldAccent)" stroke-width="2.5" />

    <!-- Stylized Bookstore / Open Book Icon -->
    <!-- Open Book Pages -->
    <path d="M -30 -12 C -18 -18 -8 -16 0 -10 C 8 -16 18 -18 30 -12 L 30 22 C 18 16 8 18 0 24 C -8 18 -18 16 -30 22 Z" fill="#ffffff" fill-opacity="0.92" />
    <!-- Spine Line -->
    <line x1="0" y1="-10" x2="0" y2="24" stroke="#0f172a" stroke-width="2.5" />
    <!-- Architectural Roof Triangle (Storefront roof) -->
    <polygon points="0,-38 -32,-20 32,-20" fill="url(#goldAccent)" />
    <!-- Little Chimney / Star -->
    <circle cx="0" cy="-44" r="3.5" fill="#fbbf24" />
  </g>

  <!-- Brand & Store Typography -->
  <!-- Arabic Title -->
  <text x="600" y="375" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="0.5">
    غلاف المتجر المعتمد
  </text>

  <!-- English Subtitle / Tagline -->
  <text x="600" y="415" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="3">
    WARAQCONNECT • BOOKSTORE COVER
  </text>

  <!-- Bottom Catchy Badge -->
  <g transform="translate(600, 465)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="0" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#34d399">
      ✨ نموذج غلاف افتراضي للمكتبة
    </text>
  </g>

  <!-- Decorative Corner Accents -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" fill="none">
    <path d="M 40 70 L 40 40 L 70 40" />
    <path d="M 1160 70 L 1160 40 L 1130 40" />
    <path d="M 40 530 L 40 560 L 70 560" />
    <path d="M 1160 530 L 1160 560 L 1130 560" />
  </g>
</svg>
