<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="infBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Rose Alert Glow -->
    <radialGradient id="roseGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#e11d48" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Diagonal Pattern -->
    <pattern id="diagStripes" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" fill="url(#infBg)" />
  <rect width="600" height="600" fill="url(#roseGlow)" />
  <rect width="600" height="600" fill="url(#diagStripes)" />

  <!-- Outer Dashed Rounded Frame -->
  <rect x="24" y="24" width="552" height="552" rx="32" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="10 10" stroke-opacity="0.4" />

  <!-- Center Broken Image Icon -->
  <g transform="translate(300, 230)">
    <!-- Squircle Icon Box -->
    <rect x="-65" y="-65" width="130" height="130" rx="30" fill="#1e293b" stroke="#334155" stroke-width="2" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.5))" />

    <!-- Photo Frame Outline -->
    <rect x="-38" y="-36" width="76" height="62" rx="10" fill="none" stroke="#94a3b8" stroke-width="2.5" />

    <!-- Mountain / Hills Silhouette inside photo -->
    <path d="M -30 18 L -14 -4 L 4 16 L 16 6 L 30 18" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sun / Moon in photo -->
    <circle cx="18" cy="-18" r="6" fill="#f43f5e" fill-opacity="0.6" />

    <!-- Broken Slash / Alert Mark -->
    <line x1="-48" y1="40" x2="48" y2="-44" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" />

    <!-- Mini Alert Badge -->
    <circle cx="42" cy="-40" r="14" fill="#f43f5e" stroke="#0f172a" stroke-width="3" />
    <text x="42" y="-35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff">!</text>
  </g>

  <!-- Typography Labels -->
  <!-- Arabic Primary Message -->
  <text x="300" y="375" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" font-size="22" font-weight="900" fill="#f1f5f9">
    الصورة غير متوفرة
  </text>

  <!-- English Sub-label -->
  <text x="300" y="410" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="2">
    IMAGE NOT FOUND
  </text>

  <!-- Help / Instructions Pill -->
  <g transform="translate(300, 465)">
    <rect x="-150" y="-18" width="300" height="36" rx="18" fill="#334155" fill-opacity="0.5" stroke="#475569" stroke-width="1.2" />
    <text x="0" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#cbd5e1">
      يرجى التحقق من الرابط أو رفع صورة جديدة
    </text>
  </g>
</svg>
